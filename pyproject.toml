[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phient-agents"
version = "1.0.0"
description = "Phient AI Ops Agent Platform - Multi-agent ecosystem for internal operations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Phient AI Ops Team" }]

dependencies = [
    "anthropic>=0.42.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.3.0",
    "chromadb>=0.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
    "mcp>=1.0.0",
    "aiosqlite>=0.20.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

azure = [
    "azure-identity>=1.19.0",
    "azure-mgmt-resource>=23.0.0",
    "azure-search-documents>=11.6.0",
    "azure-monitor-opentelemetry>=1.6.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
]

[project.scripts]
phient = "src.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
pythonpath = [".", "src"]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
